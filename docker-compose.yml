services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-insight_face}
      POSTGRES_USER: ${DB_USER:-chetanface}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-chetanface} -d ${DB_NAME:-insight_face}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
