; Install:
;   sudo cp deploy/supervisor/insight-face.conf /etc/supervisor/conf.d/insight-face.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl restart insight-face-gunicorn insight-face-celery
;
; Logs:
;   tail -f /home/ubuntu/repos/insight-face/logs/gunicorn.log
;   tail -f /home/ubuntu/repos/insight-face/logs/celery.log

[program:insight-face-gunicorn]
command=/home/ubuntu/repos/insight-face/env/bin/gunicorn config.wsgi:application --bind 127.0.0.1:8010 --workers 2 --timeout 120
directory=/home/ubuntu/repos/insight-face
user=ubuntu
autostart=true
autorestart=true
stdout_logfile=/home/ubuntu/repos/insight-face/logs/gunicorn.log
stderr_logfile=/home/ubuntu/repos/insight-face/logs/gunicorn-error.log
environment=DJANGO_SETTINGS_MODULE="config.settings"

[program:insight-face-celery]
command=/bin/bash /home/ubuntu/repos/insight-face/scripts/celery-worker.sh
directory=/home/ubuntu/repos/insight-face
user=ubuntu
autostart=true
autorestart=true
stdout_logfile=/home/ubuntu/repos/insight-face/logs/celery.log
stderr_logfile=/home/ubuntu/repos/insight-face/logs/celery-error.log
stopwaitsecs=600
environment=DJANGO_SETTINGS_MODULE="config.settings"
