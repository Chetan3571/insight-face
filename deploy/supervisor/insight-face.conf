; Install:
;   sudo cp deploy/supervisor/insight-face.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Logs:
;   sudo tail -f /var/log/supervisor/insight-face-*.log

[program:insight-face-gunicorn]
command=/home/ubuntu/repos/insight-face/env/bin/gunicorn config.wsgi:application --bind 127.0.0.1:8010 --workers 2 --timeout 120
directory=/home/ubuntu/repos/insight-face
user=ubuntu
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/insight-face-gunicorn.log
environment=DJANGO_SETTINGS_MODULE="config.settings"

[program:insight-face-celery]
command=/home/ubuntu/repos/insight-face/env/bin/celery -A config worker -l info --concurrency=2
directory=/home/ubuntu/repos/insight-face
user=ubuntu
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/insight-face-celery.log
stopwaitsecs=600
environment=DJANGO_SETTINGS_MODULE="config.settings"
