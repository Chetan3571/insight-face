# Install:
#   sudo cp deploy/nginx/newmodel.snapdme.com.conf /etc/nginx/sites-available/insight-face
#   sudo ln -sf /etc/nginx/sites-available/insight-face /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certbot HTTPS: merge location blocks into your SSL server block.
# CRITICAL: proxy_pass must be http://127.0.0.1:8010 (Gunicorn), NOT 8000.
# client_max_body_size 100M must match Django upload limit.

server {
    listen 80;
    server_name newmodel.snapdme.com;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /static/ {
        alias /home/ubuntu/repos/insight-face/staticfiles/;
    }

    location /media/ {
        alias /home/ubuntu/repos/insight-face/media/;
    }
}
