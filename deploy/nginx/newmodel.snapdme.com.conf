# Install:
#   sudo cp deploy/nginx/newmodel.snapdme.com.conf /etc/nginx/sites-available/insight-face
#   sudo ln -sf /etc/nginx/sites-available/insight-face /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# If SSL is already managed elsewhere for newmodel.snapdme.com, merge the
# location blocks below into your existing server block.

server {
    listen 80;
    server_name newmodel.snapdme.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /media/ {
        alias /home/ubuntu/repos/insight-face/media/;
    }
}
